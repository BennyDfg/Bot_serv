# Blueprint de Render para Bot_serv (plan gratuito).
# Deploy: Render Dashboard → New → Blueprint → elige el repo Bot_serv.
# Los valores `sync: false` se piden una sola vez durante la creación.
services:
  - type: web
    name: bot-serv
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: OWNER_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESUMEN_HORA
        value: "22:30"
      - key: TZ
        value: America/Havana
